server {
    listen 80;
    server_name localhost;

    default_type application/json;

    location = /mobilites-stationnement-des-parkings-en-temps-reel/lines {
        alias /data/Cannes_data.json;
    }

    location = /boom {
        return 500 '{"error":"panne simulee cote ville"}';
    }

    # Renvoie du HTML au lieu du JSON attendu : demontre le catch JacksonException.
    location = /html {
        default_type text/html;
        return 200 '<html><body>Service en maintenance</body></html>';
    }

    location / {
        return 404 '{"error":"endpoint inconnu"}';
    }
}